apiVersion: apps/v1
kind: Deployment
metadata:
  name: student-service-deployment
  namespace: uis-system
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: student-service
  template:
    metadata:
      labels:
        app: student-service
    spec:
      containers:
        - name: student-service
          image: uis/student-service:latest
          ports:
            - containerPort: 8081
          envFrom:
            - secretRef:
                name: uis-secrets
          env:
            - name: PORT
              value: "8081"
            - name: PAYMENT_SERVICE_URLS
              value: "http://payment-service:8082"
            - name: SERVER_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          resources:
            requests:
              cpu: "100m"
              memory: "64Mi"
            limits:
              cpu: "300m"
              memory: "128Mi"
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8081
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: student-service
  namespace: uis-system
spec:
  selector:
    app: student-service
  ports:
    - protocol: TCP
      port: 8081
      targetPort: 8081
---
