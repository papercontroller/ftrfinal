version: '3.8'

services:
  nginx-lb:
    image: nginx:latest
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app-replica-1
      - app-replica-2

  app-replica-1:
    build: .
    environment:
      - SERVER_ID=replica-1
      - DB_CONN=postgres://user:pass@db:5432/uis?sslmode=disable&connect_timeout=2
    depends_on:
      db:
        condition: service_healthy

  app-replica-2:
    build: .
    environment:
      - SERVER_ID=replica-2
      - DB_CONN=postgres://user:pass@db:5432/uis?sslmode=disable&connect_timeout=2
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass
      POSTGRES_DB: uis
    ports:
      - "5432:5432"
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d uis"]
      interval: 3s
      timeout: 3s
      retries: 5