events { 
    worker_connections 1024; 
}

http {
    upstream university_cluster {
        server app-replica-1:8080 max_fails=2 fail_timeout=5s;
        server app-replica-2:8080 max_fails=2 fail_timeout=5s;
    }

    server {
        listen 80;

        location / {
            proxy_pass http://university_cluster;
            proxy_connect_timeout 2s;
            proxy_read_timeout 10s;
            proxy_next_upstream error timeout http_500 http_502 http_503;
        }
    }
}